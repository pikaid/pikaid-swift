name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        swift: ["6.0", "6.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Show toolchain
        run: swift --version

      - name: Build library (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run tests (debug)
        run: swift test

      - name: Run tests (release)
        run: swift test -c release

  format:
    name: Formatting (advisory)
    runs-on: ubuntu-latest
    # swift-format rules change between toolchain releases, and the repository
    # does not pin a formatter version yet. Report drift without blocking the
    # build until that policy is decided.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Lint formatting
        run: swift format lint --recursive --strict Sources Tests Package.swift
